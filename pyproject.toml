[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dep-risk"
version = "0.1.0"
description = "Universal dependency upgrade risk analyzer CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "pydantic>=2.0.0",
    "instructor>=1.0.0",
    "openai>=1.0.0",
]

[project.scripts]
dep-risk = "dep_risk.main:app"
[project]
name = "fixture-python-basic"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "requests==2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
